name: Simple C Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build-gcc:
    runs-on: ubuntu-latest
    steps:
      - name: Pulls the code 
        uses: actions/checkout@v6
      - run: make -C src CC=gcc

  build-tcc:
    runs-on: ubuntu-latest
    steps:
      - name: Install tcc compiler
        run: |
          sudo apt update
          sudo apt -y install tcc
      - uses: actions/checkout@v6
      - run: make -C src CC=tcc

  produce:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir output
          echo "compiled data" > output/result.txt

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: output/

  consume:
    runs-on: ubuntu-latest
    needs: produce
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-output

      - run: |
          cat result.txt


