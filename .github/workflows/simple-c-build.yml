name: Simple C Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: make -C src CC=gcc

  build-tcc:
    runs-on: ubuntu-latest
    steps:
      - run: apt update
      - run: apt -y install tcc
      - uses: actions/checkout@v3
      - run: make -C src CC=tcc
